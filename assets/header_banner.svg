<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Frame -->
  <rect x="1" y="1" width="898" height="198" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Status Pill -->
  <rect x="40" y="24" width="230" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="54" cy="36" r="4" fill="#38bdf8"/>
  <text x="66" y="40" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">AI SYSTEMS &amp; RAG RESEARCH</text>

  <!-- Name Header -->
  <text x="40" y="98" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    Vishal Raaj D N D
  </text>

  <!-- Tagline / Focus -->
  <text x="42" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Dual Degree Scholar @ <tspan fill="#e2e8f0" font-weight="600">IIT Madras</tspan> &amp; <tspan fill="#e2e8f0" font-weight="600">AMET</tspan> (9.52 CGPA) • Founder @ <tspan fill="#e2e8f0" font-weight="600">AXOWEB Technologies</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="40" y1="148" x2="860" y2="148" stroke="url(#divider-grad)" stroke-width="1.5"/>

  <!-- Metric / Credential Highlights -->
  <text x="42" y="174" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    🏆 <tspan fill="#f1f5f9" font-weight="600">OpenAI Buildathon Runner-Up</tspan> (2nd Place)
  </text>
  <text x="340" y="174" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    📦 <tspan fill="#f1f5f9" font-weight="600">open-research-lite</tspan> on PyPI (-85% Context Tokens)
  </text>
  <text x="690" y="174" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    ⚡ <tspan fill="#f1f5f9" font-weight="600">AST Document Parsing</tspan>
  </text>
</svg>
